name: changelog
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
concurrency:
  group: changelog-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  entry:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changelog.d/ entry when application source changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Application source: everything except tests, browser journeys, CI,
          # contributor documentation, the presentation website and development
          # tools. In-app page help (docs/pages/) ships with the application, so
          # it counts.
          is_source() {
            case "$1" in
              docs/pages/*) return 0 ;;
              tests/* | e2e/* | */tests/* | docs/* | .github/* | .agents/* \
                | website/* | tools/* | changelog.d/*) return 1 ;;
              */*) return 0 ;;
              *.md | .gitignore | .dockerignore | .python-version) return 1 ;;
            esac
            return 0
          }
          source=""
          while IFS= read -r path; do
            if [ -n "$path" ] && is_source "$path"; then source="$source$path"$'\n'; fi
          done < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if [ -z "$source" ]; then
            echo "No application source changed; no entry needed."
            exit 0
          fi
          added="$(git diff --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" -- 'changelog.d/*.md')"
          if [ -n "$added" ]; then
            printf 'Changelog entries added:\n%s\n' "$added"
            exit 0
          fi
          printf 'Application source changed:\n%s\n' "$source"
          echo "::error::Add an entry under changelog.d/ and regenerate CHANGELOG.md" \
            "(uv run python manage.py changelog; see CONTRIBUTING.md)." \
            "If nothing users, deployers or integrators can observe changed, say so in the pull" \
            "request and ask a maintainer for the no-changelog label."
          exit 1
