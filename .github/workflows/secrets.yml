name: secrets

# The secret scan; SECURITY.md ("What is checked") says what it covers and what fails it. It runs on
# every push of a branch or a tag, on every pull request, weekly and on demand, so a secret pushed
# and then replaced before a pull request exists is still reported by the run of the push that
# carried it. GitHub starts no run for a push whose commit message asks it to skip workflows
# ([skip ci] and its variants); such commits are scanned when a pull request, a later push or the
# weekly run reaches them. Unlike the other security checks it depends on nothing published later,
# so running it on pushes to main cannot hold back a deployment for a reason outside the pushed
# commits.
#
# There is no concurrency group, so a newer push never cancels a run.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # Every commit reachable from the checked-out revision, merge commits included: on a pull
    # request, its own commits and the history of the branch it targets. The history is read as
    # text, so no attribute can hide a file's lines, and `gitleaks:allow` comments are ignored.
    # It is scanned twice: file by file, which names where a finding is, and as one text stream,
    # where no file is skipped by its name. Findings are redacted in the log. gitleaks is
    # downloaded at a pinned version and checked against its published checksum; update both
    # together from https://github.com/gitleaks/gitleaks/releases.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Check that only .gitleaks.toml can excuse a finding
        # gitleaks also reads ignore lists from .gitleaksignore files; none may exist.
        run: |
          if find . -name .gitleaksignore -not -path ./.git/\* | grep .; then
            echo "::error::Remove .gitleaksignore; record a synthetic value in .gitleaks.toml"
            exit 1
          fi
      - name: Check that the settings still report a secret
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          token="ghp_$(LC_ALL=C tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 36)"
          printf 'token = "%s"\n' "$token" > "$canary/settings_local.py"
          status=0
          "$RUNNER_TEMP/gitleaks" dir --ignore-gitleaks-allow --redact --no-banner \
            --config .gitleaks.toml "$canary" || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::gitleaks exited $status on a generated token instead of 1"
            exit 1
          fi
      - name: Scan the history for secrets, file by file
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--text --diff-merges=first-parent HEAD" \
            --ignore-gitleaks-allow --redact --verbose --no-banner --config .gitleaks.toml .
      - name: Scan the history for secrets as one text stream
        # The default rules skip files by name (every package-lock.json, SVG images, some
        # third-party scripts and gitleaks' own configuration); a text stream has no file names.
        # text_windows.py keeps gitleaks' chunked reading from splitting a line. pipefail makes a
        # failure anywhere in the pipeline fail the step, not only gitleaks' own result.
        run: |
          set -o pipefail
          git log -p --text --diff-merges=first-parent HEAD \
            | python3 tools/security/text_windows.py \
            | "$RUNNER_TEMP/gitleaks" stdin --ignore-gitleaks-allow --redact --verbose \
              --no-banner --config .gitleaks.toml
