name: secrets

# The secret scan; SECURITY.md ("What is checked") says what it covers and what fails it. It runs on
# every push of a branch or a tag, on every pull request, weekly and on demand, so a secret pushed
# and then replaced before a pull request exists is still reported by the run of the push that
# carried it. GitHub starts no run for a push whose commit message asks it to skip workflows
# ([skip ci] and its variants), nor for a push of more than three tags at once; such commits are
# scanned when a pull request, a later push or the weekly run reaches them. Unlike the other security checks it depends on nothing published later,
# so running it on pushes to main cannot hold back a deployment for a reason outside the pushed
# commits.
#
# There is no concurrency group, so a newer push never cancels a run.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    # Every commit reachable from the checked-out revision, merge commits included: on a pull
    # request, its own commits and the history of the branch it targets. The history is read as
    # text, file by file, so no attribute can hide a file's lines, and `gitleaks:allow` comments
    # are ignored. gitleaks' default configuration never scans some files, chosen by name; the
    # scan uses that configuration without its list of paths (tools/security/gitleaks_config.py),
    # so every file is read. Findings are redacted in the log. gitleaks and its default
    # configuration are downloaded for a pinned version and checked against pinned checksums;
    # update the three values together from https://github.com/gitleaks/gitleaks/releases.
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_CONFIG_SHA256: e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Build the configuration without the default list of skipped paths
        run: |
          default="$RUNNER_TEMP/gitleaks-default.toml"
          curl --fail --silent --show-error --location --retry 3 --output "$default" \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  ${default}" | sha256sum --check --strict
          python3 tools/security/gitleaks_config.py "$default" .gitleaks.toml \
            > "$RUNNER_TEMP/gitleaks.toml"
      - name: Check that only .gitleaks.toml can excuse a finding
        # gitleaks also reads ignore lists from .gitleaksignore files; none may exist.
        run: |
          if find . -name .gitleaksignore -not -path ./.git/\* | grep .; then
            echo "::error::Remove .gitleaksignore; record a synthetic value in .gitleaks.toml"
            exit 1
          fi
      - name: Check that the settings still report a secret, whatever the file is called
        # The tokens have no letter l: gitleaks' default rules pass over a value that contains
        # "false" or ends in "null", which would make this check fail for the wrong reason.
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary/static/vendor"
          token() { echo "ghp_$(LC_ALL=C tr -dc 'A-KM-Za-km-z0-9' < /dev/urandom | head -c 36)"; }
          printf 'token = "%s"\n' "$(token)" > "$canary/settings_local.py"
          printf '{"note": "%s"}\n' "$(token)" > "$canary/static/vendor/package-lock.json"
          printf '<svg><!-- %s --></svg>\n' "$(token)" > "$canary/badge.svg"
          status=0
          "$RUNNER_TEMP/gitleaks" dir --ignore-gitleaks-allow --redact --no-banner \
            --config "$RUNNER_TEMP/gitleaks.toml" --report-format json \
            --report-path "$RUNNER_TEMP/canary.json" "$canary" || status=$?
          found=$(python3 -c 'import json, sys; print(len({f["File"] for f in json.load(open(sys.argv[1]))}))' "$RUNNER_TEMP/canary.json")
          if [ "$status" -ne 1 ] || [ "$found" -ne 3 ]; then
            echo "::error::gitleaks exited $status and reported $found of 3 generated tokens"
            exit 1
          fi
      - name: Scan the history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --log-opts="--text --diff-merges=first-parent HEAD" \
            --ignore-gitleaks-allow --redact --verbose --no-banner \
            --config "$RUNNER_TEMP/gitleaks.toml" .
