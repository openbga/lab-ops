# Secret scan settings for gitleaks (see SECURITY.md, "What is checked").
#
# The default rules apply. The allowlist names synthetic values in the tests that the generic
# rule mistakes for secrets. Each entry is one exact value, so anything else in the same file,
# including a real secret, is still reported. List a value only when it is synthetic, and say
# where it is used.
#
# Keep the allowlist to exact values: gitleaks 8.30.1 ignores `condition = "AND"` when an
# allowlist has both paths and regexes, so a path would excuse every secret in that file
# (tests/test_security_checks.py checks this file).
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic passwords and keys used by the tests"
regexTarget = "secret"
regexes = [
  # A sign-in owner's password in the first-run setup tests.
  '''^a-long-unique-passphrase-93$''',
  # A made-up donor key for the person-link disclosure tests.
  '''^SIM-DONOR-11223344$''',
  # The wrong password the sign-in limit tests submit.
  '''^wrong-guess-729$''',
]
