[project]
name = "lab-ops"
version = "0.1.0"
description = "OpenBGA Lab Ops: free, open-source client service and operations software for laboratories"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
readme = "README.md"
dependencies = [
  "Django>=5.2.19,<5.3",
  "django-allauth[mfa]>=65.21.1,<66",
  "psycopg[binary]>=3.3.8,<4",
  "gunicorn>=26.2,<27",
  "whitenoise>=6.12,<7",
  "pillow>=13,<14",
  "dj-database-url>=3,<4",
]

[project.urls]
Homepage = "https://github.com/openbga/lab-ops"
Documentation = "https://github.com/openbga/lab-ops#documentation"
Issues = "https://github.com/openbga/lab-ops/issues"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-django>=4.14,<5", "ruff>=0.17.4,<0.18"]
e2e = [
    "pytest-playwright>=0.10,<0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = [
    "tests",
    "accounts/tests",
    "clients/tests",
    "teams/tests",
    "taxonomy/tests",
    "desk/tests",
    "service_levels/tests",
    "links/tests",
    "request_forms/tests",
    "dataimport/tests",
    "attachments/tests",
    "nonconformance/tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
